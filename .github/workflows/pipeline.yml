name: Validating Lint, Build and Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão das imagens Docker (ex: 1.0, 1.1, 2.0)'
        required: true
        default: '1.0'

env:
  FRONT_IMAGE: fsfernando072/familia-connect-front
  GRAFANA_IMAGE: fsfernando072/familia-connect-grafana

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

  docker-front:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Building image with tag ${VERSION}"
          docker build -t ${FRONT_IMAGE}:${VERSION} .
          docker push ${FRONT_IMAGE}:${VERSION}
          docker tag ${FRONT_IMAGE}:${VERSION} ${FRONT_IMAGE}:latest
          docker push ${FRONT_IMAGE}:latest

  grafana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Grafana image
        run: docker build -t ${GRAFANA_IMAGE}:test ./grafana

      - name: Smoke test
        run: bash ./grafana/smoke-test.sh ${GRAFANA_IMAGE}:test

      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Grafana image
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=${{ github.event.inputs.version }}
          docker tag ${GRAFANA_IMAGE}:test ${GRAFANA_IMAGE}:${VERSION}
          docker tag ${GRAFANA_IMAGE}:test ${GRAFANA_IMAGE}:latest
          docker push ${GRAFANA_IMAGE}:${VERSION}
          docker push ${GRAFANA_IMAGE}:latest