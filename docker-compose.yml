services:
  front:
    build: .
    image: fsfernando072/familia-connect-front:latest
    container_name: familia-connect-front
    restart: always
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_BASE_URL=${API_BASE_URL:-/api}
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8080}
