apiVersion: 1

# Conexão do Grafana com o MySQL do Família Connect.
# Os valores vêm das variáveis de ambiente do container do Grafana (ver docker-compose.yml / .env.example).
# Use o usuário somente-leitura criado por grafana/sql/usuario-somente-leitura.sql.
datasources:
  - name: Família Connect (MySQL)
    uid: familia-connect-mysql
    type: mysql
    access: proxy
    url: ${GRAFANA_DB_HOST}:${GRAFANA_DB_PORT}
    user: ${GRAFANA_DB_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${GRAFANA_DB_NAME}
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
