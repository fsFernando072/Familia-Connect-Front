server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # env-config.js é gerado em runtime pelo entrypoint.sh e pode mudar
    # a cada deploy/restart do container — nunca deve ser cacheado.
    location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
